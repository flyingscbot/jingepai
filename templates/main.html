{% extends "base.html" %}

{% block title %}金格Pi - 实训大厅{% endblock %}

{% block body_class %}panel-page{% endblock %}

{% block content %}
<main class="panel-main">
    <div class="page-title">
        <h2>模拟理财实训大厅</h2>
        <p>零基础学习股票、基金，模拟交易零风险，轻松掌握理财知识</p>
    </div>
    <div class="panel-cards">
        <div class="panel-card">
            <img src="{{ url_for('static', filename='icons/wallet.svg') }}" class="panel-card-icon" alt="">
            <h3>我的交易数据</h3>
            <p>上传交易数据，查看历史记录</p>
            <a href="{{ url_for('trade') }}" class="func-btn">进入查看详情</a>
        </div>
        <div class="panel-card">
            <img src="{{ url_for('static', filename='icons/chat.svg') }}" class="panel-card-icon" alt="">
            <h3>投资聊天室</h3>
            <p>选择合适聊天室加入，获得建议</p>
            <a href="{{ url_for('chat') }}" class="func-btn">浏览聊天室</a>
        </div>
        <div class="panel-card">
            <img src="{{ url_for('static', filename='icons/mbti.svg') }}" class="panel-card-icon" alt="">
            <h3>投资性格MBTI测试</h3>
            <p>专属金融性格测评，分析风险偏好。</p>
            <a href="{{ url_for('mbti') }}" class="func-btn">开始测试</a>
        </div>
    </div>
</main>
{% endblock %}
