<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 外框菱形 -->
  <polygon points="24,4 44,24 24,44 4,24" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 十字分割线，代表 MBTI 四个维度 -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="44" y2="24" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 中心点亮 -->
  <circle cx="24" cy="24" r="2.5" fill="#d4af37"/>
</svg>
