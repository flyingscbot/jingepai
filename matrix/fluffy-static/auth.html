<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金格Pi - 登录完成</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Noto Sans SC", sans-serif;
      background: #050505;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <p id="msg">登录完成，正在返回聊天室…</p>
  <script>
    (function () {
      var href = window.location.href;
      var search = window.location.search || "";
      if (!/(?:^|[?&])loginToken=/.test(search)) {
        document.getElementById("msg").textContent =
          "未收到登录凭证，请关闭此页后重试。";
        return;
      }

      var payload = { "flutter-web-auth-2": href };
      var origin = window.location.origin;

      // 1) 存入 localStorage，FluffyChat 加载时读取
      try {
        localStorage.setItem("flutter-web-auth-2", href);
      } catch (e) {}

      // 2) 通知主窗口（弹窗 / iframe 场景）
      if (window.opener && window.opener !== window) {
        try {
          window.opener.postMessage(payload, origin);
        } catch (e) {}
      }

      // 3) 关闭本窗口
      window.close();

      // 4) 如果 close 失败（浏览器限制），用空白页 + close 兜底
      setTimeout(function () {
        try {
          window.open("", "_self", "");
          window.close();
        } catch (e) {}
      }, 100);

      // 5) 最终兜底：2 秒后仍开着则跳回 /chat
      setTimeout(function () {
        window.location.replace(origin + "/chat" + search);
      }, 2000);
    })();
  </script>
</body>
</html>
