server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:1000 http://localhost:1000 http://127.0.0.1:5000 http://localhost:5000;" always;

    # 实训：注入脚本 — 隐藏验证 Toast / 密钥存储 / 备份 / 加密设置 + 设置页 MXID
    # + 强制金格Pi主题并隐藏主题切换（Element 1.12+ 无 UIFeature.themeSetting）
    # + 金格视觉主题 CSS（炭黑/金 + Noto Sans SC，覆盖 Compound 默认绿/紫）
    # （Element 1.12+ 无 config 可关 Encryption 页与 VERIFY Toast）
    # 使用相对路径，以便 /element/ 同源反代也能加载
    location = /lab-suppress-e2ee-nags.js {
        alias /lab-static/lab-suppress-e2ee-nags.js;
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    location = /lab-jingepi-theme.css {
        alias /lab-static/lab-jingepi-theme.css;
        add_header Cache-Control "no-store";
        default_type text/css;
    }

    location = /jingepi-theme-vars.css {
        alias /lab-static/jingepi-theme-vars.css;
        add_header Cache-Control "no-store";
        default_type text/css;
    }

    # Element 默认把 iOS/Android 跳到 App 引导页（含英文
    # 「The desktop site does not work on mobile」）。金格已做手机 Web UI，禁止该拦截。
    location = /mobile_guide {
        rewrite ^ /index.html last;
    }
    location = /mobile_guide/ {
        rewrite ^ /index.html last;
    }
    location = /mobile_guide/index.html {
        rewrite ^ /index.html last;
    }
    location ^~ /mobile_guide/ {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        gzip off;
        sub_filter_types text/html;
        sub_filter_once off;
        # 必须在 bundle.js 之前写入 cookie，否则启动脚本仍会 location=mobile_guide/
        sub_filter '</head>' '<script>try{document.cookie="element_mobile_redirect_to_guide=false;path=/;max-age=31536000";}catch(e){}</script></head>';
        sub_filter '<meta name="viewport" content="width=device-width, initial-scale=1">' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
        sub_filter '</body>' '<link rel="stylesheet" href="jingepi-theme-vars.css"><link rel="stylesheet" href="lab-jingepi-theme.css"><script src="lab-suppress-e2ee-nags.js"></script></body>';
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:1000 http://localhost:1000 http://127.0.0.1:5000 http://localhost:5000;" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.json {
        alias /app/config.json;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:1000 http://localhost:1000 http://127.0.0.1:5000 http://localhost:5000;" always;
    }
}
