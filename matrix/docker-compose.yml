# 自建 Matrix（Synapse）+ Cinny Web + 金格 OIDC
# 使用前请先启动金格 Flask（默认 http://host.docker.internal:1000）
# 注意：聊天前端已迁移为 Cinny；请勿恢复 fluffychat 服务。

services:
  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_dev_password
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data:/data
      - ./homeserver.yaml:/data/homeserver.yaml:ro
    ports:
      - "8008:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cinny:
    image: ajbura/cinny:v4.12.6
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./cinny-config.json:/app/config.json:ro
    ports:
      - "8082:80"

volumes:
  synapse-pg: