# 自建 Matrix（Synapse）+ FluffyChat Web + 金格 OIDC
# 使用前请先启动金格 Flask（默认 http://host.docker.internal:1000）

services:
  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_dev_password
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data:/data
      - ./homeserver.yaml:/data/homeserver.yaml:ro
    ports:
      - "8008:8008"
    extra_hosts:
      # 让容器能访问宿主机上的金格 OIDC（Windows/macOS Docker Desktop）
      - "host.docker.internal:host-gateway"

  # 社区预构建镜像（官方无独立 Docker Hub 名；源码 Dockerfile 也可自建）
  # 配置挂到 /home/sws/public/config.json；容器内监听 8080
  fluffychat:
    image: ghcr.io/etkecc/fluffychat-web:v2.8.0
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./fluffychat-config.json:/home/sws/public/config.json:ro
      # 金格壳层主题（直接访问 :8082 也能加载；/fluffychat/ 由 Flask 注入同源）
      - ./fluffy-static/lab-jingepi-fluffy.css:/home/sws/public/lab-jingepi-fluffy.css:ro
      - ./fluffy-static/lab-jingepi-fluffy.js:/home/sws/public/lab-jingepi-fluffy.js:ro
      - ./fluffy-static/index.html:/home/sws/public/index.html:ro
    ports:
      - "8082:8080"

volumes:
  synapse-pg:
